<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Astro Patrouille</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=IM+Fell+English+SC&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;background:#0e0a1a;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
  body{display:flex;align-items:center;justify-content:center}
  canvas{display:block;border-radius:10px;box-shadow:0 0 60px #000a,0 0 0 1px #ffffff14}
  #nom{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);max-width:calc(100vw - 32px);box-sizing:border-box;
       background:rgba(24,16,44,.92);border:1px solid #ffffff2a;border-radius:12px;padding:16px 18px;color:#f1e8ff;
       font:600 22px Caveat,cursive;text-align:center;box-shadow:0 10px 40px #000a}
  #nom[hidden]{display:none}
  #nom div{display:flex;gap:8px;margin-top:10px;justify-content:center}
  #nom input{font:600 22px Caveat,cursive;width:12ch;min-width:0;padding:4px 10px;border-radius:8px;border:1px solid #ffffff40;background:#0e0a1a;color:#fff}
  #nom button{font:700 20px Caveat,cursive;padding:4px 14px;border-radius:8px;border:0;background:#7ad08a;color:#0e0a1a;cursor:pointer}
  /* ---- panneau des scènes : un parchemin aquarelle ---- */
  #scene{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(760px,calc(100vw - 32px));max-height:calc(100vh - 32px);
         overflow:auto;box-sizing:border-box;display:flex;gap:18px;align-items:flex-start;padding:18px 22px 16px;border-radius:14px;
         background:radial-gradient(ellipse at 30% 20%,#fbf6ea,#efe4cc 70%,#e4d3b1);color:#2a1f2e;box-shadow:0 14px 50px #000c,inset 0 0 40px #b8986a55;
         font:500 21px/1.3 Caveat,cursive;touch-action:auto;user-select:text;-webkit-user-select:text}
  #scene[hidden]{display:none}
  #scene .portrait,#scene .portrait2{width:min(230px,34%);flex:none;mix-blend-mode:multiply;align-self:center;transition:opacity .25s,filter .25s}
  #scene.duo .portrait,#scene.duo .portrait2{width:min(170px,24%)}
  #scene .portrait2{order:3}
  #scene .muet{opacity:.4;filter:grayscale(.6)}
  #scene .ligne{margin:0 0 6px}
  #scene .ligne.neuve{animation:apparait .35s ease-out}
  @keyframes apparait{from{opacity:0;transform:translateY(4px)}to{opacity:1}}
  #scene .qui{font-weight:700;margin-right:4px}
  #scene .q-kaimana{color:#1f5a6a} #scene .q-ivar{color:#4a4a5a} #scene .q-ren{color:#8a2a2a} #scene .q-yaga{color:#6a5a1a} #scene .q-nefer{color:#9a6a0a}
  #scene .corps{flex:1;min-width:0}
  #scene h2{margin:0 0 6px;font:400 30px 'IM Fell English SC',serif;color:#3b2140}
  #scene .texte p{margin:0 0 8px}
  #scene .choix{display:flex;flex-direction:column;gap:7px;margin-top:10px}
  #scene .choix button{font:600 20px/1.2 Caveat,cursive;text-align:left;padding:7px 12px;border-radius:9px;border:1px solid #6a4a3a55;
         background:#fffaf0cc;color:#2a1f2e;cursor:pointer}
  #scene .choix button:hover:not([disabled]),#scene .choix button:focus-visible{background:#fff;border-color:#6a3a5a;outline:none;box-shadow:0 0 0 2px #c24d8a55}
  #scene .choix button[disabled]{opacity:.45;cursor:not-allowed}
  #scene .choix .num{display:inline-block;min-width:1.2em;color:#8a5a3a}
  #scene em{color:#7a4a2a;font-style:normal}
  #scene .effets{margin:4px 0 0;padding-left:20px;color:#5a2a4a;font-weight:700}
  #scene .note{margin:6px 0 0;color:#5a4a3a;font-size:18px}
  #scene .ressources{margin-top:10px;font-size:16px;color:#6a5a4a;border-top:1px dashed #8a6a4a66;padding-top:6px}
  @media (max-width:560px){#scene{flex-direction:column;align-items:center;font-size:19px;padding:14px}#scene .portrait,#scene .portrait2{width:42%}#scene h2{font-size:25px}
    #scene.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px}#scene.duo .portrait,#scene.duo .portrait2{width:100%;order:0}#scene.duo .corps{grid-column:1/3;grid-row:2}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<form id="nom" hidden>
  <label for="nom-in">Ton score entre au tableau ! Ton nom :</label>
  <div><input id="nom-in" maxlength="12" autocomplete="off" spellcheck="false" enterkeyhint="done"><button type="submit">OK</button></div>
</form>
<div id="scene" hidden role="dialog" aria-live="polite">
  <img class="portrait" alt="">
  <div class="corps">
    <h2></h2>
    <div class="texte"></div>
    <div class="extra"></div>
    <div class="choix"></div>
    <div class="ressources"></div>
  </div>
  <img class="portrait2" alt="">
</div>
<!-- Ordre de chargement : moteur → données → combat → carte → scènes → chef d'orchestre -->
<script src="js/moteur.js"></script>
<script src="data/evenements.js"></script>
<script src="js/combat.js"></script>
<script src="js/carte.js"></script>
<script src="js/scenes.js"></script>
<script src="js/main.js"></script>
</body>
</html>
