<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Astro Patrouille</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=IM+Fell+English+SC&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;background:#0e0a1a;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
  body{display:flex;align-items:center;justify-content:center}
  canvas{display:block;border-radius:10px;box-shadow:0 0 60px #000a,0 0 0 1px #ffffff14}
  #nom{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);max-width:calc(100vw - 32px);box-sizing:border-box;
       background:rgba(24,16,44,.92);border:1px solid #ffffff2a;border-radius:12px;padding:16px 18px;color:#f1e8ff;
       font:600 22px Caveat,cursive;text-align:center;box-shadow:0 10px 40px #000a}
  #nom[hidden]{display:none}
  #nom div{display:flex;gap:8px;margin-top:10px;justify-content:center}
  #nom input{font:600 22px Caveat,cursive;width:12ch;min-width:0;padding:4px 10px;border-radius:8px;border:1px solid #ffffff40;background:#0e0a1a;color:#fff}
  #nom button{font:700 20px Caveat,cursive;padding:4px 14px;border-radius:8px;border:0;background:#7ad08a;color:#0e0a1a;cursor:pointer}
</style>
</head>
<body>
<canvas id="c"></canvas>
<form id="nom" hidden>
  <label for="nom-in">Ton score entre au tableau ! Ton nom :</label>
  <div><input id="nom-in" maxlength="12" autocomplete="off" spellcheck="false" enterkeyhint="done"><button type="submit">OK</button></div>
</form>
<script>
'use strict';
// =====================================================================
//  ASTRO PATROUILLE — style aquarelle, boss lovecraftiens
//  Toute la logique se fait dans un monde de 160 x 90 "unités".
//  Le rendu est mis à l'échelle (R pixels par unité) pour rester net.
// =====================================================================
const W = 160, H = 90, TOP = 9, TAU = Math.PI * 2;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let R = 6, scale = 1, paper = null;

function resize() {
  const s = Math.min((innerWidth - 16) / W, (innerHeight - 16) / H);
  scale = s;
  cv.style.width = W * s + 'px'; cv.style.height = H * s + 'px';
  R = Math.min(10, Math.max(2, s * (devicePixelRatio || 1)));
  cv.width = Math.round(W * R); cv.height = Math.round(H * R);
  makePaper();
}

// ---------- outils ----------
const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.random() * a.length | 0];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const overlap = (a, b, p = 0) =>
  a.x + p < b.x + b.w - p && a.x + a.w - p > b.x + p && a.y + p < b.y + b.h - p && a.y + a.h - p > b.y + p;
const mk = (w, h) => { const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(w)); c.height = Math.max(1, Math.round(h)); return c; };

// =====================================================================
//  PINCEAUX AQUARELLE (dessin procédural)
// =====================================================================
function blobPts(x, y, rx, ry, irr, n = 14) {
  const o = rand(0, TAU);
  return Array.from({ length: n }, (_, i) => {
    const a = o + i / n * TAU, k = 1 + (Math.random() * 2 - 1) * irr;
    return { x: x + Math.cos(a) * rx * k, y: y + Math.sin(a) * ry * k };
  });
}
function smoothClosed(g, pts) {
  const n = pts.length;
  g.beginPath();
  g.moveTo((pts[n - 1].x + pts[0].x) / 2, (pts[n - 1].y + pts[0].y) / 2);
  for (let i = 0; i < n; i++) {
    const p = pts[i], q = pts[(i + 1) % n];
    g.quadraticCurveTo(p.x, p.y, (p.x + q.x) / 2, (p.y + q.y) / 2);
  }
  g.closePath();
}
// Lavis : plusieurs couches transparentes irrégulières + bord plus foncé (pigment qui s'accumule)
function wash(g, x, y, rx, ry, col, { layers = 4, alpha = .2, irr = .18, edge = .4 } = {}) {
  g.save(); g.fillStyle = col; g.strokeStyle = col; g.lineWidth = Math.max(rx, ry) * .05;
  for (let l = 0; l < layers; l++) {
    const k = 1 - l * .07;
    smoothClosed(g, blobPts(x + rand(-1, 1) * rx * .05, y + rand(-1, 1) * ry * .05, rx * k, ry * k, irr));
    g.globalAlpha = alpha; g.fill();
    if (edge) { g.globalAlpha = alpha * edge; g.stroke(); }
  }
  g.restore();
}
function speckle(g, x, y, rx, ry, col, n, alpha = .35) {
  g.save(); g.fillStyle = col;
  for (let i = 0; i < n; i++) {
    const a = rand(0, TAU), d = Math.sqrt(Math.random());
    g.globalAlpha = alpha * rand(.4, 1);
    g.beginPath(); g.arc(x + Math.cos(a) * rx * d, y + Math.sin(a) * ry * d, rand(.08, .3), 0, TAU); g.fill();
  }
  g.restore();
}
function veins(g, cx, cy, r, n, col) {
  g.save(); g.strokeStyle = col; g.lineCap = 'round';
  for (let i = 0; i < n; i++) {
    let a = rand(0, TAU), x = cx + Math.cos(a) * r, y = cy + Math.sin(a) * r;
    g.globalAlpha = rand(.2, .45); g.lineWidth = rand(.12, .25);
    g.beginPath(); g.moveTo(x, y);
    for (let s = 0; s < 4; s++) { a += rand(-.6, .6); x -= Math.cos(a) * r * .14; y -= Math.sin(a) * r * .14; g.lineTo(x, y); }
    g.stroke();
  }
  g.restore();
}
// Peint un sprite une seule fois dans une image hors-écran (PR pixels par unité)
const PR = 8;
function paint(w, h, fn, pad = 1) {
  const c = mk((w + pad * 2) * PR, (h + pad * 2) * PR), g = c.getContext('2d');
  g.scale(PR, PR); g.translate(pad, pad); fn(g, w, h);
  return { c, w, h, pad };
}
function drawP(sp, x, y, { alpha = 1, rot = 0, sx = 1, sy = 1 } = {}) {
  ctx.save(); ctx.globalAlpha = alpha;
  ctx.translate(x + sp.w / 2, y + sp.h / 2);
  if (rot) ctx.rotate(rot);
  if (sx !== 1 || sy !== 1) ctx.scale(sx, sy);
  ctx.drawImage(sp.c, -sp.w / 2 - sp.pad, -sp.h / 2 - sp.pad, sp.w + sp.pad * 2, sp.h + sp.pad * 2);
  ctx.restore();
}
// Halo lumineux (pré-calculé par couleur)
const glowCache = {};
function glow(x, y, r, rgb, a = 1) {
  let c = glowCache[rgb];
  if (!c) {
    c = glowCache[rgb] = mk(64, 64); const g = c.getContext('2d');
    const gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
    gr.addColorStop(0, `rgba(${rgb},1)`); gr.addColorStop(.35, `rgba(${rgb},.45)`); gr.addColorStop(1, `rgba(${rgb},0)`);
    g.fillStyle = gr; g.fillRect(0, 0, 64, 64);
  }
  ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = a;
  ctx.drawImage(c, x - r, y - r, r * 2, r * 2); ctx.restore();
}
// Tentacule animée, dessinée en direct en deux passages translucides
function tentacle(x, y, ang, len, th, t, ph, col, amp = .5, suckers = false) {
  const seg = 12;
  for (let pass = 0; pass < 2; pass++) {
    const pts = []; let px = x, py = y;
    const p2 = ph + pass * .25, wk = pass ? .8 : 1;
    for (let i = 0; i <= seg; i++) {
      const f = i / seg, a = ang + Math.sin(t * 2.2 + p2 + f * 3.2) * amp * f;
      if (i) { px += Math.cos(a) * len / seg; py += Math.sin(a) * len / seg; }
      pts.push({ x: px, y: py, a, w: th * (1 - f * .9) * wk });
    }
    ctx.beginPath();
    pts.forEach((p, i) => { const nx = -Math.sin(p.a) * p.w / 2, ny = Math.cos(p.a) * p.w / 2; i ? ctx.lineTo(p.x + nx, p.y + ny) : ctx.moveTo(p.x + nx, p.y + ny); });
    for (let i = pts.length - 1; i >= 0; i--) { const p = pts[i]; ctx.lineTo(p.x + Math.sin(p.a) * p.w / 2, p.y - Math.cos(p.a) * p.w / 2); }
    ctx.closePath();
    ctx.fillStyle = col; ctx.globalAlpha = pass ? .35 : .6; ctx.fill();
    ctx.strokeStyle = col; ctx.lineWidth = th * .1; ctx.globalAlpha = .4; ctx.stroke();
    if (suckers && !pass) {
      ctx.fillStyle = '#d9c3cf'; ctx.globalAlpha = .35;
      for (let i = 2; i < seg - 1; i += 2) { const p = pts[i]; ctx.beginPath(); ctx.arc(p.x + Math.sin(p.a) * p.w * .3, p.y - Math.cos(p.a) * p.w * .3, p.w * .16, 0, TAU); ctx.fill(); }
    }
  }
  ctx.globalAlpha = 1;
}
const blinkOpen = (t, ph, per) => { const k = (t + ph) % per; return k < .2 ? Math.abs(Math.cos(k / .2 * Math.PI)) : 1; };
// Œil vivant qui suit une cible
function drawEye(x, y, rx, ry, open, tx, ty, iris = '#c9d84b', slit = true) {
  const oy = ry * open;
  ctx.save();
  if (oy < .2) {
    ctx.strokeStyle = '#1a1020'; ctx.globalAlpha = .7; ctx.lineWidth = Math.max(.2, ry * .14);
    ctx.beginPath(); ctx.moveTo(x - rx, y); ctx.quadraticCurveTo(x, y + ry * .35, x + rx, y); ctx.stroke();
    ctx.restore(); return;
  }
  ctx.beginPath(); ctx.ellipse(x, y, rx, oy, 0, 0, TAU); ctx.fillStyle = '#eadfca'; ctx.fill();
  ctx.save(); ctx.clip();
  const gr = ctx.createRadialGradient(x, y, 0, x, y, rx);
  gr.addColorStop(.5, 'rgba(234,223,202,0)'); gr.addColorStop(1, 'rgba(160,60,85,.6)');
  ctx.fillStyle = gr; ctx.fillRect(x - rx, y - oy, rx * 2, oy * 2);
  const dx = tx - x, dy = ty - y, l = Math.hypot(dx, dy) || 1, m = Math.min(rx, ry) * .38;
  const ix = x + dx / l * m, iy = y + dy / l * m * .7, ir = Math.min(rx, ry) * .58;
  ctx.fillStyle = iris; ctx.beginPath(); ctx.arc(ix, iy, ir, 0, TAU); ctx.fill();
  ctx.strokeStyle = 'rgba(30,20,10,.45)'; ctx.lineWidth = ir * .2; ctx.stroke();
  ctx.fillStyle = '#120a10'; ctx.beginPath();
  if (slit) ctx.ellipse(ix, iy, ir * .22, ir * .82, 0, 0, TAU); else ctx.arc(ix, iy, ir * .45, 0, TAU);
  ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.75)'; ctx.beginPath(); ctx.arc(ix - ir * .35, iy - ir * .35, ir * .2, 0, TAU); ctx.fill();
  ctx.restore();
  ctx.strokeStyle = 'rgba(30,15,35,.65)'; ctx.lineWidth = Math.max(.15, ry * .1);
  ctx.beginPath(); ctx.ellipse(x, y, rx, oy, 0, 0, TAU); ctx.stroke();
  ctx.restore();
}

// Texture papier + vignette, posée par-dessus toute l'image
function makePaper() {
  const w = cv.width, h = cv.height; paper = mk(w, h);
  const g = paper.getContext('2d'), id = g.createImageData(w, h), d = id.data;
  for (let i = 0; i < d.length; i += 4) {
    const n = Math.random();
    if (n < .5) { d[i] = d[i + 1] = d[i + 2] = n < .25 ? 255 : 0; d[i + 3] = Math.random() * 16; }
  }
  g.putImageData(id, 0, 0);
  const gr = g.createRadialGradient(w / 2, h / 2, h * .3, w / 2, h / 2, w * .62);
  gr.addColorStop(0, 'rgba(10,5,20,0)'); gr.addColorStop(1, 'rgba(10,5,20,.6)');
  g.fillStyle = gr; g.fillRect(0, 0, w, h);
}

// =====================================================================
//  SPRITES PEINTS
// =====================================================================
function paintAst(size) {
  return paint(size, size, (g, w) => {
    const c = w / 2;
    wash(g, c, c, c * .9, c * .82, '#8a6d55', { layers: 4, alpha: .4, irr: .22 });
    wash(g, c + c * .2, c + c * .25, c * .6, c * .5, '#3a2a22', { layers: 3, alpha: .32, irr: .3 });
    wash(g, c - c * .3, c - c * .3, c * .35, c * .28, '#e2c9a6', { layers: 2, alpha: .35, irr: .3, edge: 0 });
    for (let i = 0; i < 3; i++) {
      const a = rand(0, TAU), d = rand(0, c * .5);
      wash(g, c + Math.cos(a) * d, c + Math.sin(a) * d, c * .18, c * .15, '#2a1d18', { layers: 2, alpha: .35, irr: .2 });
    }
    speckle(g, c, c, c * .8, c * .8, '#1a1220', 14, .4);
  });
}
const SP = {};
function buildSprites() {
  SP.asts = [paintAst(9), paintAst(9), paintAst(9)];
  SP.rocks = [paintAst(4.5), paintAst(4.5), paintAst(4.5)];
  SP.larve = paint(7, 5, g => {
    wash(g, 3.4, 2.5, 3.1, 2, '#5fae86', { layers: 4, alpha: .45, irr: .12 });
    wash(g, 4.3, 3, 2, 1.2, '#1f4a38', { layers: 2, alpha: .35 });
    wash(g, 2.6, 1.7, 1.2, .6, '#d4f5df', { layers: 2, alpha: .3, edge: 0 });
    g.fillStyle = '#e9f57a'; g.beginPath(); g.arc(1.7, 2.4, .55, 0, TAU); g.fill();
    g.fillStyle = '#1a1020'; g.beginPath(); g.arc(1.55, 2.4, .25, 0, TAU); g.fill();
  });
  SP.oeil = paint(6, 6, g => {
    wash(g, 3, 3, 3, 3, '#c25a78', { layers: 4, alpha: .42, irr: .14 });
    wash(g, 3.6, 3.6, 2, 2, '#3c1a2a', { layers: 2, alpha: .3 });
    veins(g, 3, 3, 2.9, 6, '#d98ba0');
  });
  // --- Boss 1 : l'Œil du Néant ---
  SP.boss0 = paint(24, 24, (g, w, h) => {
    const cx = w / 2, cy = h / 2;
    wash(g, cx, cy, w * .47, h * .47, '#7d5f94', { layers: 5, alpha: .34, irr: .1 });
    wash(g, cx + 2, cy + 2, w * .38, h * .36, '#24182f', { layers: 3, alpha: .24, irr: .18 });
    wash(g, cx - 4, cy - 5, w * .2, h * .13, '#9a7fb0', { layers: 3, alpha: .2, edge: 0 });
    veins(g, cx, cy, w * .45, 12, '#8a2f45');
    wash(g, cx - 2, cy, 9, 7, '#160d1d', { layers: 3, alpha: .32, irr: .08 });
    speckle(g, cx, cy, w * .45, h * .45, '#140c1a', 30);
  }, 2);
  // --- Boss 3 : la Masse aux Mille Yeux ---
  SP.boss2 = paint(28, 24, (g, w, h) => {
    const cx = w / 2, cy = h / 2;
    wash(g, cx, cy, w * .44, h * .44, '#4a6040', { layers: 4, alpha: .32, irr: .2 });
    for (let i = 0; i < 14; i++)
      wash(g, cx + rand(-1, 1) * w * .28, cy + rand(-1, 1) * h * .26, rand(3.5, 7), rand(3, 6),
           pick(['#4a6040', '#6b8a55', '#2c3826', '#6a5a78']), { layers: 3, alpha: .2, irr: .25 });
    g.save(); g.strokeStyle = '#a9c49a'; g.lineWidth = .2;
    for (let i = 0; i < 10; i++) { g.globalAlpha = rand(.15, .35); g.beginPath(); g.arc(cx + rand(-11, 11), cy + rand(-9, 9), rand(.4, 1.2), 0, TAU); g.stroke(); }
    g.restore();
    speckle(g, cx, cy, w * .44, h * .44, '#0c100b', 40);
  }, 2);
}

// Détoure une image : retire le fond clair (papier) en partant des bords
function cutout(img, maxW = 512, minL = 200, spread = 40, { warm = false, holes = 0, holeL = 228 } = {}) {
  const k0 = Math.min(1, maxW / img.width);
  const c = mk(img.width * k0, img.height * k0), g = c.getContext('2d');
  g.drawImage(img, 0, 0, c.width, c.height);
  try {
    const w = c.width, h = c.height, d = g.getImageData(0, 0, w, h), p = d.data;
    const bgLike = i => { const r = p[i], gg = p[i + 1], b = p[i + 2], mx = Math.max(r, gg, b), mn = Math.min(r, gg, b); return mn > minL && mx - mn < spread && (!warm || r >= b - 3); };
    const seen = new Uint8Array(w * h), st = [];
    for (let x = 0; x < w; x++) st.push(x, (h - 1) * w + x);
    for (let y = 0; y < h; y++) st.push(y * w, y * w + w - 1);
    while (st.length) {
      const k = st.pop(); if (seen[k]) continue; seen[k] = 1;
      if (!bgLike(k * 4)) continue;
      p[k * 4 + 3] = 0;
      const x = k % w;
      if (x > 0) st.push(k - 1); if (x < w - 1) st.push(k + 1);
      if (k >= w) st.push(k - w); if (k < w * (h - 1)) st.push(k + w);
    }
    // poches de papier enfermées entre les tentacules : on retire les grandes zones très claires
    if (holes) {
      const lab = new Uint8Array(w * h);
      for (let s0 = 0; s0 < w * h; s0++) {
        if (lab[s0] || p[s0 * 4 + 3] === 0) continue;
        const i0 = s0 * 4; if (!(bgLike(i0) && Math.min(p[i0], p[i0 + 1], p[i0 + 2]) > holeL)) continue;
        const comp = [], q = [s0]; lab[s0] = 1;
        while (q.length) {
          const k = q.pop(); comp.push(k); const x = k % w;
          for (const n of [x > 0 ? k - 1 : -1, x < w - 1 ? k + 1 : -1, k - w, k + w]) {
            if (n < 0 || n >= w * h || lab[n] || p[n * 4 + 3] === 0) continue;
            const j = n * 4; if (bgLike(j) && Math.min(p[j], p[j + 1], p[j + 2]) > holeL - 15) { lab[n] = 1; q.push(n); }
          }
        }
        if (comp.length > holes) for (const k of comp) p[k * 4 + 3] = 0;
      }
    }
    // retire les petites taches isolées (restes de papier ou de pinceau)
    if (holes) {
      const lab = new Uint8Array(w * h);
      for (let s0 = 0; s0 < w * h; s0++) {
        if (lab[s0] || p[s0 * 4 + 3] === 0) continue;
        const comp = [], q = [s0]; lab[s0] = 1;
        while (q.length) {
          const k = q.pop(); comp.push(k); const x = k % w;
          for (const n of [x > 0 ? k - 1 : -1, x < w - 1 ? k + 1 : -1, k - w, k + w])
            if (n >= 0 && n < w * h && !lab[n] && p[n * 4 + 3] !== 0) { lab[n] = 1; q.push(n); }
        }
        if (comp.length < w * h * .004) for (const k of comp) p[k * 4 + 3] = 0;
      }
    }
    // adoucit le contour
    for (let k = w; k < w * (h - 1); k++) {
      if (p[k * 4 + 3] === 0) continue;
      if (p[(k - 1) * 4 + 3] === 0 || p[(k + 1) * 4 + 3] === 0 || p[(k - w) * 4 + 3] === 0 || p[(k + w) * 4 + 3] === 0) p[k * 4 + 3] = 150;
    }
    g.putImageData(d, 0, 0);
  } catch (e) {}
  return c;
}

// Retourne une image en miroir (gauche ↔ droite)
function flipH(src) {
  const c = mk(src.width, src.height), g = c.getContext('2d');
  g.translate(src.width, 0); g.scale(-1, 1); g.drawImage(src, 0, 0); return c;
}
// Pivote une image d'un quart de tour vers la gauche (le haut passe à gauche)
function rotateLeft(src) {
  const c = mk(src.height, src.width), g = c.getContext('2d');
  g.translate(0, src.width); g.rotate(-Math.PI / 2); g.drawImage(src, 0, 0); return c;
}

// =====================================================================
//  SON
// =====================================================================
let actx = null, muted = false, drone = null;
function unlockAudio() {
  try { if (!actx) { actx = new (window.AudioContext || window.webkitAudioContext)(); loadSfx().then(initMusic); }
        if (actx.state === 'suspended') actx.resume(); } catch (e) {}
}
function beep(f, d, vol = .04, slide = 0, type = 'triangle') {
  if (muted || !actx) return;
  try {
    const t = actx.currentTime, o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), t + d);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + d);
    o.connect(g).connect(actx.destination); o.start(t); o.stop(t + d);
  } catch (e) {}
}
// ---------- Sons et musiques (fichiers CC0 dans assets/sons, crédits dans le README) ----------
let master = null;
const SFX = {}, SFX_FILES = { tir: 'tir.mp3', triple: 'tir-triple.mp3', ennemi: 'tir-ennemi.mp3', bonus: 'bonus.mp3', bouclier: 'bouclier.mp3', laser: 'laser.m4a' };
const lastPlay = {};
async function loadSfx() {
  master = actx.createGain(); master.gain.value = muted ? 0 : 1; master.connect(actx.destination);
  for (const [k, f] of Object.entries(SFX_FILES)) {
    try { const r = await fetch('assets/sons/' + f); SFX[k] = await actx.decodeAudioData(await r.arrayBuffer()); } catch (e) {}
  }
}
// Joue un bruitage ; dur = coupe le son (avec fondu) après dur secondes ; gap = délai mini entre deux lectures
function play(k, vol = .5, dur = 0, gap = 0) {
  const b = SFX[k]; if (!b || !actx || !master) return false;
  const t = actx.currentTime;
  if (gap && lastPlay[k] && t - lastPlay[k] < gap) return true;
  lastPlay[k] = t;
  const src = actx.createBufferSource(), g = actx.createGain();
  src.buffer = b; g.gain.value = vol; src.connect(g).connect(master); src.start(t);
  if (dur) { g.gain.setValueAtTime(vol, t + dur * .6); g.gain.linearRampToValueAtTime(.0001, t + dur); src.stop(t + dur + .02); }
  return true;
}

// =====================================================================
//  MISE À JOUR
// =====================================================================
function update(dt) {
  T += dt; flash = Math.max(0, flash - dt); shake = Math.max(0, shake - dt); overT -= dt;
  const slow = phase === 'boss' && state === 'play' ? .35 : 1;
  bgX += 3 * dt * slow;
  for (const s of stars) { s.x -= s.v * dt * slow; if (s.x < -2) { s.x = W + 2; s.y = rand(TOP, H); } }
  for (const p of parts) { p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= .97; p.vy *= .97; p.life -= dt; }
  parts = parts.filter(p => p.life > 0);
  if (banner && (banner.t -= dt) <= 0) banner = null;
  if (state !== 'play') { laserSound(false); return; }

  phaseT -= dt;
  if (phase === 'intro' && phaseT <= 0) phase = 'waves';
  else if (phase === 'waves') {
    levelT -= dt; spawnT -= dt;
    if (spawnT <= 0) { spawn(); spawnT = Math.max(.4, 1.6 - level * .12) * rand(.6, 1.4); }
    if (levelT <= 0) { phase = 'warn'; phaseT = 3.5; if (MUS.arrivee) musicPlay('arrivee', .75, .4); }
  } else if (phase === 'warn') {
    if (!MUS.arrivee && (phaseT * 1.2 | 0) !== ((phaseT + dt) * 1.2 | 0)) beep(65, .6, .06, -15, 'sine');
    shake = Math.max(shake, .05);
    if (phaseT <= 0 && enemies.length === 0) { phase = 'boss'; spawnBoss(); }
  } else if (phase === 'clear' && phaseT <= 0) { level++; startLevel(); }

  // joueur
  if (!touch.on) {
    let dx = 0, dy = 0;
    if (keys.left) dx--; if (keys.right) dx++; if (keys.up) dy--; if (keys.down) dy++;
    P.x += dx * 70 * dt; P.y += dy * 70 * dt;
  }
  P.x = clamp(P.x, 0, W * .6); P.y = clamp(P.y, TOP - 1, H - P.h);
  P.cd -= dt; P.inv -= dt;
  const firing = (keys.fire || touch.on) && phase !== 'clear';
  // Munitions spéciales : consommées dès qu'on tire, qu'il y ait une cible ou non
  P.beam = firing && P.laser > 0;
  if (P.beam) P.laser = Math.max(0, P.laser - dt);
  laserSound(P.beam);
  if (firing && !P.beam && P.cd <= 0) {
    P.cd = .16; const bx = P.x + 15, by = P.y + 4.2;
    bullets.push({ x: bx, y: by, w: 4, h: 1, vx: 150, vy: 0 });
    if (P.spread > 0) { P.spread--; bullets.push({ x: bx, y: by, w: 4, h: 1, vx: 145, vy: -40 }, { x: bx, y: by, w: 4, h: 1, vx: 145, vy: 40 }); }
    if (!play(P.spread > 0 ? 'triple' : 'tir', P.spread > 0 ? .3 : .22, .25)) beep(900, .05, .015, 300);
  }

  for (const b of bullets) { b.x += b.vx * dt; b.y += b.vy * dt; if (b.x > W || b.y < TOP - 2 || b.y > H) b.dead = true; }
  for (const b of ebullets) { b.x += b.vx * dt; b.y += b.vy * dt; if (b.x < -4 || b.x > W + 4 || b.y < TOP - 4 || b.y > H + 2) b.dead = true; }
  for (const it of items) { it.x -= 20 * dt; if (it.x < -8) it.dead = true; }

  for (const e of enemies) {
    e.t += dt; e.hit -= dt; e.x += e.vx * dt;
    if (e.kind === 'ast' || e.kind === 'rock') {
      e.rot += e.spin * dt; e.y += e.vy * dt;
      if (e.y < TOP || e.y > H - e.h) e.vy *= -1;
    } else if (e.kind === 'fighter') {
      e.y = e.by + Math.sin(e.t * 3) * 8;
      if (e.x < W - 8 && e.x > P.x + 22) {
        e.fire -= dt;
        if (e.fire <= 0) { e.fire = rand(2, 4) / (1 + level * .15); shoot(e.x, e.y + 2.5, Math.PI, 60 + level * 5); }
      }
    } else if (e.kind === 'diver' && e.x > P.x + 6) {
      e.y += clamp((P.y + 1 - e.y) * 1.5, -28, 28) * dt;
    }
    e.y = clamp(e.y, TOP, H - e.h);
    if (e.x < -24) e.dead = true;
  }

  if (boss) {
    const b = boss; b.t += dt; b.hit -= dt;
    if (b.x > b.tx) b.x -= 16 * dt;
    b.y = b.cy + Math.sin(b.t * (.9 + level * .1)) * b.amp;
    if (b.x <= b.tx + 1) {
      b.fire -= dt;
      if (b.fire <= 0) { bossAttack(b); b.fire = Math.max(.45, 1.6 - level * .15) * (b.hp < b.max / 2 ? .65 : 1); }
    }
  }

  // laser : rayon continu qui traverse tout et inflige des dégâts en continu
  if (P.beam) {
    const nx = P.x + 16, ny = P.y + 4.4, beam = { x: nx, y: ny - 1.3, w: W - nx, h: 2.6 };
    for (const e of enemies) {
      if (e.dead || !overlap(beam, e)) continue;
      e.lz = (e.lz || 0) + dt * 14; e.hit = .05;
      while (e.lz >= 1 && e.hp > 0) { e.lz--; e.hp--; }
      if (e.hp <= 0) kill(e);
    }
    if (boss && boss.x < W - 6 && overlap(beam, boss, 2)) {
      boss.lz = (boss.lz || 0) + dt * 7; boss.hit = .05;
      while (boss.lz >= 1 && boss.hp > 0) { boss.lz--; boss.hp--; explode(boss.x + 3, ny, 2, ['#ff9ad5', '#ffffff'], .7); }
      if (boss.hp <= 0) killBoss();
    }
  }

  // collisions : tirs du joueur
  for (const b of bullets) {
    if (b.dead) continue;
    for (const e of enemies) {
      if (!e.dead && overlap(b, e)) {
        b.dead = true; e.hp--; e.hit = .1;
        if (e.hp <= 0) kill(e); else beep(260, .04, .02);
        break;
      }
    }
    if (!b.dead && boss && boss.x < W - 6 && overlap(b, boss, 2)) {
      b.dead = true; boss.hp--; boss.hit = .08; beep(160, .04, .025);
      explode(b.x + 2, b.y, 2, ['#9be37a', '#3b2a4a'], .8);
      if (boss.hp <= 0) killBoss();
    }
  }
  // collisions : joueur
  const hb = pHB();
  for (const it of items) if (!it.dead && overlap(hb, it)) { it.dead = true; pickItem(it); }
  if (P.inv <= 0 && phase !== 'clear') {
    let hit = false;
    for (const e of enemies) if (!e.dead && overlap(hb, e, .5)) { kill(e); hit = true; break; }
    if (!hit) for (const b of ebullets) if (!b.dead && overlap(hb, b)) { b.dead = true; hit = true; break; }
    if (!hit && boss && overlap(hb, boss, 3)) hit = true;
    if (hit) hurt();
  }

  bullets = bullets.filter(b => !b.dead); ebullets = ebullets.filter(b => !b.dead);
  enemies = enemies.filter(e => !e.dead); items = items.filter(i => !i.dead);
}

// =====================================================================
//  AFFICHAGE
// =====================================================================
const blink = (hz = 2) => ((T * hz * 2) | 0) % 2 === 0;

  ctx.save(); ctx.globalAlpha = alpha;

  ctx.textAlign = align; ctx.textBaseline = 'middle'; ctx.fillStyle = color;
  ctx.shadowColor = 'rgba(10,5,25,.85)'; ctx.shadowBlur = R * 1.4;
  ctx.fillText(s, x, y); ctx.restore();
}
const TITLE = { font: 'IM Fell English SC', weight: 400 };

function drawBackground() {
  const img = IMG.bg;
  if (img) {
    // l'image est agrandie et dérive lentement (pas de raccord visible)
    const k = Math.max(W / img.width, H / img.height) * 1.25, dw = img.width * k, dh = img.height * k;
    const ox = (W - dw) / 2 * (1 + Math.sin(bgX * .011));

    ctx.drawImage(img, ox, oy, dw, dh);
  } else { ctx.fillStyle = '#231a3d'; ctx.fillRect(0, 0, W, H); }
  ctx.fillStyle = 'rgba(14,8,30,.42)'; ctx.fillRect(0, 0, W, H);
  // teinte maladive quand un boss approche
  if (state === 'play' && (phase === 'warn' || phase === 'boss')) {
    const a = (phase === 'warn' ? clamp((3.5 - phaseT) / 3.5, 0, 1) : 1) * (.14 + Math.sin(T * 1.5) * .05);
    ctx.fillStyle = `rgba(30,70,45,${a})`; ctx.fillRect(0, 0, W, H);
  }
  for (const s of stars) glow(s.x, s.y, s.s, '225,220,255', .55 * Math.min(1, s.v / 25));
}
function drawShip(x, y, alpha = 1, p = null) {
  if (p && p.beam) drawBeam(x + 16, y + 4.4);
  glow(x + .8, y + 4.6, 2.4 + Math.random() * .7, '120,255,210', .8 * alpha);   // réacteur arrière
  ctx.save(); ctx.globalAlpha = alpha;
  if (IMG.ship) ctx.drawImage(IMG.ship, x, y, 17, 8.3);
  ctx.restore();
  if (p && p.shield > 0) drawShield(x + 8.5, y + 4.2);
}
// Bouclier : bulle d'aquarelle qui ondule autour du vaisseau
function drawShield(x, y) {
  glow(x, y, 13, '120,210,255', .18);
  ctx.save(); ctx.strokeStyle = '#bfe9ff'; ctx.fillStyle = 'rgba(140,210,255,.10)';
  for (let pass = 0; pass < 2; pass++) {
    ctx.beginPath();
    for (let i = 0; i <= 40; i++) {
      const a = i / 40 * TAU, wob = 1 + Math.sin(a * 5 + T * 3 + pass) * .04;
      const px = x + Math.cos(a) * 11.5 * wob, py = y + Math.sin(a) * 7 * wob;
      i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
    }
    ctx.globalAlpha = pass ? .25 : .55; ctx.lineWidth = pass ? 1.2 : .45;
    if (!pass) ctx.fill(); ctx.stroke();
  }
  ctx.globalAlpha = .5; ctx.fillStyle = '#ffffff';
  ctx.beginPath(); ctx.ellipse(x - 5, y - 4, 2.5, .8, -.3, 0, TAU); ctx.fill();
  ctx.restore();
}
// Laser : rayon rose qui ondule légèrement
function drawBeam(x, y) {
  glow(x, y, 4 + Math.random(), '255,140,210', .9);
  ctx.save(); ctx.lineCap = 'round'; ctx.globalCompositeOperation = 'lighter';
  [[3.2, .25, '#ff6fc1'], [1.8, .45, '#ff9ad5'], [.7, .95, '#fff4fb']].forEach(([w, a, c], k) => {
    ctx.strokeStyle = c; ctx.globalAlpha = a; ctx.lineWidth = w + Math.random() * .3;
    ctx.beginPath(); ctx.moveTo(x, y);
    for (let px = x + 4; px <= W + 4; px += 4) ctx.lineTo(px, y + Math.sin(px * .35 - T * 30 + k) * .35 * (k < 2 ? 1 : .3));
    ctx.stroke();
  });
  ctx.restore();
}
function drawEnemy(e) {
  const a = e.hit > 0 ? .55 : 1, j = e.hit > 0 ? .5 : 0;
  if (e.kind === 'ast' || e.kind === 'rock') { drawP(e.sp, e.x + j, e.y, { rot: e.rot, alpha: a }); return; }
  if (e.kind === 'fighter') {
    [-.35, 0, .35].forEach((o, i) => tentacle(e.x + 5.5, e.y + 2.6, o, 6, 1.3, T, e.t + i * 1.3, '#4f9a76', .9));
    drawP(SP.larve, e.x + j, e.y, { alpha: a });
    glow(e.x + 1.7, e.y + 2.4, 1.4, '230,245,120', .35);
  } else if (e.kind === 'diver') {
    [-.6, -.2, .2, .6].forEach((o, i) => tentacle(e.x + 4.8, e.y + 3, o, 5, .9, T, e.t + i, '#b85470', 1));
    drawP(SP.oeil, e.x + j, e.y, { alpha: a });
    drawEye(e.x + 3, e.y + 3, 2.2, 2.2, blinkOpen(T, e.t, 4), P ? P.x + 10 : 0, P ? P.y + 3 : H / 2, '#7fc4c8', false);
  }
}
function drawBoss(b) {
  const t = b.t, cx = b.x + b.w / 2, cy = b.y + b.h / 2, px = P.x + 10, py = P.y + 3;
  const br = 1 + Math.sin(t * 2) * .025, a = b.hit > 0 ? .7 : 1, j = b.hit > 0 ? .6 : 0;
  const k = b.def.sp;
  glow(cx, cy, b.w * .95, '140,220,170', .16 + Math.sin(t * 2) * .04);
  if (k === 'boss0') {
    for (let i = 0; i < 8; i++) {
      const ang = (-.75 + i / 7 * 1.5) * Math.PI;
      tentacle(cx + Math.cos(ang) * b.w * .38, cy + Math.sin(ang) * b.h * .38, ang, 13 + (i % 3) * 3, 3.2, t, i * 1.7, '#6a4a80', .9, true);
    }
    drawP(b.sp, b.x + j, b.y, { sx: br, sy: br, alpha: a });
    drawEye(cx - 2 + j, cy, 7.2, 5.2, blinkOpen(t, 0, 5), px, py, '#c9d84b', true);
  } else if (k === 'veilleur') {
    // Image peinte, découpée en bandes horizontales : le bas ondule comme des tentacules
    const img = IMG.boss;
    if (img) {
      const n = 32, sw = img.width / n, sy = 2 - br, dw = b.w * br, dh = b.h * sy, x0 = cx - dw / 2, y0 = cy - dh / 2;
      ctx.save(); ctx.globalAlpha = a;
      for (let i = 0; i < n; i++) {
        const f = i / n, wav = Math.sin(t * 2.4 - f * 6) * 2.2 * Math.max(0, f - .4);
        ctx.drawImage(img, i * sw, 0, sw + .6, img.height, x0 + f * dw + j, y0 + wav, dw / n + .1, dh);
      }
      ctx.restore();
    }
    for (const e of b.eyes) glow(b.x + e.x, b.y + e.y, e.r * 2, '255,170,60', .22 + .18 * Math.sin(t * 3 + e.ph));
  } else {
    for (let i = 0; i < 7; i++) {
      const ang = i / 7 * TAU + .3;
      tentacle(cx + Math.cos(ang) * b.w * .38, cy + Math.sin(ang) * b.h * .36, ang, 6 + (i % 3) * 2, 3.8, t * .7, i, '#56744a', .6);
    }
    drawP(b.sp, b.x + j, b.y, { sx: br, sy: 2 - br, alpha: a });
    for (const e of b.eyes) drawEye(b.x + e.x + j, b.y + e.y, e.r, e.r * .8, blinkOpen(t, e.ph, e.per), px, py, e.col, e.r > 1.8);
  }
}
function drawItem(it) {
  const x = it.x + 3, y = it.y + 3, d = ITEMS[it.type];
  glow(x, y, 5.5, d.rgb, .55 + Math.sin(T * 5) * .15);
  ctx.save(); ctx.translate(x, y); ctx.lineWidth = .45; ctx.lineJoin = 'round';
  if (it.type === 'spread') {            // étoile : tir triple
    ctx.rotate(T * 1.5); ctx.strokeStyle = '#e4fff3'; ctx.beginPath();
    for (let i = 0; i <= 5; i++) { const a = i * 4 * Math.PI / 5 - Math.PI / 2; ctx[i ? 'lineTo' : 'moveTo'](Math.cos(a) * 2.6, Math.sin(a) * 2.6); }
    ctx.stroke();
  } else if (it.type === 'shield') {     // bulle : bouclier
    ctx.strokeStyle = '#d9f2ff'; ctx.fillStyle = 'rgba(140,210,255,.25)';
    ctx.beginPath(); ctx.arc(0, 0, 2.6 + Math.sin(T * 4) * .15, 0, TAU); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#fff'; ctx.globalAlpha = .7; ctx.beginPath(); ctx.ellipse(-1, -1.2, .9, .4, -.5, 0, TAU); ctx.fill();
  } else {                                // éclair : laser
    ctx.strokeStyle = '#ffe3f4'; ctx.beginPath();
    ctx.moveTo(.8, -2.8); ctx.lineTo(-1, .2); ctx.lineTo(.6, .2); ctx.lineTo(-.8, 2.8); ctx.stroke();
  }
  ctx.restore();
}

function draw() {
  ctx.setTransform(R, 0, 0, R, 0, 0);
  if (shake > 0) ctx.translate(rand(-.7, .7), rand(-.7, .7));
  drawBackground();

  if (!ready) { text('Chargement…', W / 2, H / 2, { align: 'center', size: 8 }); finishFrame(); return; }
  if (state === 'title') { drawTitle(); finishFrame(); return; }

  for (const it of items) drawItem(it);
  for (const e of enemies) drawEnemy(e);
  if (boss) drawBoss(boss);
  if (state === 'play') drawShip(P.x, P.y, P.inv > 0 && blink(6) ? .3 : 1, P);

  ctx.save(); ctx.lineCap = 'round';
  for (const b of bullets) {
    glow(b.x + 2, b.y + .5, 2.2, '120,200,255', .5);
    ctx.strokeStyle = '#e4f5ff'; ctx.lineWidth = .9;
    ctx.beginPath(); ctx.moveTo(b.x, b.y + .5); ctx.lineTo(b.x + 4 - b.vy * .02, b.y + .5 + b.vy * .02); ctx.stroke();
  }
  ctx.restore();
  for (const b of ebullets) {
    glow(b.x + 1, b.y + 1, 2.6, b.rgb, .55);
    ctx.fillStyle = b.col; ctx.beginPath(); ctx.arc(b.x + 1, b.y + 1, .8, 0, TAU); ctx.fill();
  }
  for (const p of parts) {
    const f = p.life / p.max;
    ctx.globalAlpha = f * .5; ctx.fillStyle = p.col;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r * (1 + (1 - f) * 1.4), 0, TAU); ctx.fill();
  }
  ctx.globalAlpha = 1;

  drawHUD();
  if (state === 'play') {
    const bd = BOSSES[(level - 1) % BOSSES.length];
    if (phase === 'intro') {
      text('Niveau ' + level, W / 2, 36, { align: 'center', size: 14, ...TITLE });
      text(bd.tag, W / 2, 49, { align: 'center', size: 6, alpha: .85 });
    }
    if (phase === 'warn') text('Quelque chose s’éveille…', W / 2, 44, { align: 'center', size: 9, ...TITLE, color: '#c8f0b0', alpha: .55 + Math.sin(T * 4) * .35 });
    if (phase === 'clear') {
      text('Niveau ' + level + ' terminé', W / 2, 34, { align: 'center', size: 11, ...TITLE });
      text('Bonus +' + 500 * level + '   ·   +1 vie', W / 2, 47, { align: 'center', size: 6 });
    }
    if (paused) {
      ctx.fillStyle = 'rgba(10,5,25,.5)'; ctx.fillRect(0, 0, W, H);
      text('Pause', W / 2, 42, { align: 'center', size: 14, ...TITLE });
      text('P ou toucher pour reprendre', W / 2, 54, { align: 'center', size: 5, alpha: .8 });
    }
  }
  if (state === 'over') {
    ctx.fillStyle = 'rgba(10,5,25,.68)'; ctx.fillRect(0, 0, W, H);
    text('Partie terminée', 40, 22, { align: 'center', size: 11, ...TITLE });
    text('Englouti par l’abîme…', 40, 31, { align: 'center', size: 5, alpha: .75 });
    text('Score  ' + score, 40, 42, { align: 'center', size: 8 });
    text('Niveau ' + level, 40, 50, { align: 'center', size: 5, alpha: .8 });
    if (newRecord && !naming) text('Nouveau record !', 40, 58, { align: 'center', size: 6, color: '#c8f0b0', alpha: blink() ? 1 : .5 });
    drawScoreTable(84, 14, 10);
    if (overT <= 0 && !naming) text('Espace ou toucher pour rejouer', 40, 74, { align: 'center', size: 5, alpha: .55 + Math.sin(T * 4) * .35 });
  }
  if (banner && state === 'play') text(banner.text, W / 2, 16, { align: 'center', size: 7, ...TITLE, color: '#e8f6ff', alpha: Math.min(1, banner.t * 1.5) });
  finishFrame();
}
function finishFrame() {
  if (flash > 0) { ctx.fillStyle = `rgba(235,255,225,${flash * 2.5})`; ctx.fillRect(-2, -2, W + 4, H + 4); }
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  if (paper) ctx.drawImage(paper, 0, 0);
}
// Tableau des scores : rang, nom, niveau, score
function drawScoreTable(x, y, n) {
  const w = 70;
  ctx.fillStyle = 'rgba(255,255,255,.06)'; ctx.fillRect(x - 3, y - 6, w + 6, 8 + n * 6.2);
  text('Meilleurs scores', x + w / 2, y - 1.5, { align: 'center', size: 5.5, ...TITLE, color: '#d9c8ea' });
  if (!scores.length) { text('Aucun score pour l’instant', x + w / 2, y + 12, { align: 'center', size: 4.5, alpha: .6 }); return; }
  scores.slice(0, n).forEach((s, i) => {
    const yy = y + 6 + i * 6.2, me = i === myRank, c = me ? '#c8f0b0' : '#f1e8ff', al = me ? (blink(1.5) ? 1 : .7) : .85;
    text((i + 1) + '.', x + 4, yy, { align: 'right', size: 4.6, color: c, alpha: al });
    text(s.name, x + 6, yy, { size: 4.6, color: c, alpha: al });
    text('niv ' + s.level, x + 48, yy, { align: 'right', size: 3.8, color: c, alpha: al * .7 });
    text(String(s.score), x + w, yy, { align: 'right', size: 4.6, color: c, alpha: al });
  });
}
function drawHUD() {
  const gr = ctx.createLinearGradient(0, 0, 0, TOP + 2);
  gr.addColorStop(0, 'rgba(10,5,25,.75)'); gr.addColorStop(1, 'rgba(10,5,25,0)');
  ctx.fillStyle = gr; ctx.fillRect(0, 0, W, TOP + 2);
  for (let i = 0; i < Math.min(P.lives, 5); i++) if (IMG.ship) ctx.drawImage(IMG.ship, 2 + i * 7.5, 1.6, 6.2, 3);
  // bonus actifs (clignotent quand ils vont s'arrêter)
  // (sur une 2e ligne sous les vies, pour ne jamais chevaucher le nom du boss)
  let bx = 2.5;
  const tag = (label, col, tLeft) => { if (!(tLeft < 2 && !blink(4))) text(label, bx, 9.4, { size: 4.3, color: col, alpha: .9 }); bx += label.length * 2.1 + 3.5; };
  if (P.spread > 0) tag('✦ Triple ' + P.spread, '#c8f0dc', P.spread / 5);
  if (P.laser > 0) tag('Laser ' + P.laser.toFixed(1).replace('.', ',') + ' s', '#ffb3de', P.laser);
  if (P.shield > 0) tag('Bouclier', '#bfe9ff', 99);
  text(String(score).padStart(6, '0'), W - 2, 3.8, { align: 'right', size: 6 });
  if (boss) {
    text(boss.def.name, W / 2, 2.7, { align: 'center', size: 4.2, ...TITLE, color: '#d9c8ea' });
    ctx.fillStyle = 'rgba(255,255,255,.15)'; ctx.fillRect(W / 2 - 25, 5.2, 50, 1.3);
    const g2 = ctx.createLinearGradient(W / 2 - 25, 0, W / 2 + 25, 0);
    g2.addColorStop(0, '#7ad08a'); g2.addColorStop(1, '#c24d8a');
    ctx.fillStyle = g2; ctx.fillRect(W / 2 - 25, 5.2, 50 * boss.hp / boss.max, 1.3);
  } else text('Niveau ' + level, W / 2, 3.8, { align: 'center', size: 5.5, alpha: .85 });
}
function drawTitle() {
  // tentacules qui émergent du bas de l'écran
  [[18, 1.3], [40, 1.7], [128, 1.5], [148, 1.25]].forEach(([x, ang], i) =>
    tentacle(x, H + 3, -ang, 22 + (i % 2) * 6, 5, T * .7, i * 2, '#2b3d34', .8, true));
  text('Astro', W / 2, 18, { align: 'center', size: 15, ...TITLE });
  text('Patrouille', W / 2, 32, { align: 'center', size: 15, ...TITLE });
  text('— au-delà du voile des étoiles —', W / 2, 42, { align: 'center', size: 5.5, alpha: .75 });
  // alterne entre le vaisseau et les 3 meilleurs scores
  if (scores.length && T % 12 > 6) {
    text('Meilleurs scores', W / 2, 50, { align: 'center', size: 5, ...TITLE, color: '#d9c8ea' });
    scores.slice(0, 3).forEach((s, i) => text(`${i + 1}.  ${s.name}  —  ${s.score}`, W / 2, 56.5 + i * 5.2, { align: 'center', size: 4.8, alpha: .9 }));
  } else drawShip(((T * 30) % (W + 50)) - 30, 50 + Math.sin(T * 2) * 1.5);
  text('Espace ou toucher pour jouer', W / 2, 76, { align: 'center', size: 6.5, alpha: .55 + Math.sin(T * 4) * .4 });
  text('Flèches / ZQSD : bouger   ·   Espace : tirer   ·   P : pause   ·   M : son', W / 2, 84.5, { align: 'center', size: 3.8, alpha: .6 });
}

// =====================================================================
//  CONTRÔLES
// =====================================================================
const keys = {};
const KM = { ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right', ArrowUp: 'up', KeyW: 'up',
             ArrowDown: 'down', KeyS: 'down', Space: 'fire', KeyJ: 'fire' };  // KeyW/A/S/D = Z/Q/S/D sur AZERTY
function pressStart() { if (ready && !naming && (state === 'title' || (state === 'over' && overT <= 0))) newGame(); }
addEventListener('keydown', e => {
  unlockAudio();
  if (naming) return;                      // on tape son nom : le jeu ignore le clavier
  const k = KM[e.code]; if (k) { keys[k] = true; e.preventDefault(); }
  if (e.repeat) return;
  if (e.code === 'Space' || e.code === 'Enter') pressStart();
  if ((e.code === 'KeyP' || e.code === 'Escape') && state === 'play') paused = !paused;
  if (e.code === 'KeyM') setMuted(!muted);
});
addEventListener('keyup', e => { const k = KM[e.code]; if (k) keys[k] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; touch.on = false; if (state === 'play') paused = true; });

// Tactile / souris : glisser pour déplacer, tir automatique tant qu'on appuie
const touch = { on: false };
addEventListener('pointerdown', e => {
  unlockAudio();
  if (naming || e.target.closest('#nom')) return;
  if (state !== 'play') { pressStart(); return; }
  if (paused) { paused = false; return; }
  Object.assign(touch, { on: true, id: e.pointerId, ox: e.clientX, oy: e.clientY, sx: P.x, sy: P.y });
});
addEventListener('pointermove', e => {
  if (!touch.on || e.pointerId !== touch.id || paused) return;
  P.x = touch.sx + (e.clientX - touch.ox) / scale * 1.3;
  P.y = touch.sy + (e.clientY - touch.oy) / scale * 1.3;
});
const endTouch = e => { if (e.pointerId === touch.id) touch.on = false; };
addEventListener('pointerup', endTouch); addEventListener('pointercancel', endTouch);

// ---------- saisie du nom pour le tableau des scores ----------
let naming = false;
const nomBox = document.getElementById('nom'), nomInput = nomBox.querySelector('input');
function askName() {
  naming = true; nomBox.hidden = false; nomInput.value = lastName;
  for (const k in keys) keys[k] = false; touch.on = false;
  setTimeout(() => { nomInput.focus(); nomInput.select(); }, 50);
}
nomBox.addEventListener('submit', e => {
  e.preventDefault();
  lastName = nomInput.value.trim().slice(0, 12) || 'Anonyme';
  addScore(lastName);
  naming = false; nomBox.hidden = true; nomInput.blur(); overT = .6;
});

// =====================================================================
//  DÉMARRAGE
// =====================================================================
addEventListener('resize', resize); resize();
const loadImg = src => new Promise(r => { const i = new Image(); i.onload = () => r(i); i.onerror = () => r(null); i.src = src; });
const fontsOk = document.fonts ? Promise.all([document.fonts.load('700 20px Caveat'), document.fonts.load('20px "IM Fell English SC"')]).catch(() => {}) : Promise.resolve();
Promise.all([loadImg('assets/fond.jpg'), loadImg('assets/vaisseau.jpg'), loadImg('assets/boss-veilleur.jpg'), fontsOk]).then(([bg, ship, bossImg]) => {
  IMG.bg = bg;
  IMG.ship = ship ? flipH(cutout(ship, 400, 215, 30)) : null;                                // nez vers la droite
  IMG.boss = bossImg ? rotateLeft(cutout(bossImg, 420, 205, 45, { warm: true, holes: 160 })) : null;  // tête vers le joueur
  buildSprites(); ready = true;
});

let last = performance.now(), wasPaused = false;
function loop(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  if (paused !== wasPaused) { wasPaused = paused; musicPauseAll(paused); if (paused) laserSound(false); }
  if (!paused) update(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
